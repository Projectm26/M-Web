# Railway — M-Web (Shubh555 public site)
#
# Dockerfile path: repo root (Dockerfile)
#
# Required at Docker build (baked into the Vite client) — set on the service
# BEFORE first deploy, then Redeploy if you change it:
#   VITE_API_BASE_URL = https://<api>.up.railway.app   (no /api suffix)
#
# Use a Railway reference if the API is in the same project, e.g.:
#   VITE_API_BASE_URL=https://${{M-Backend.RAILWAY_PUBLIC_DOMAIN}}

# Runtime:
#   CMS_ACCESS_KEY = long random secret (required for /cms admin + banner upload)
#   Volume mount: /app/data  (SQLite + hero uploads)
#
# Do NOT set a custom Start Command in Railway UI — the Dockerfile ENTRYPOINT
# (docker-entrypoint.sh) must run so /app/data is chowned before the app starts.
#
# Also add this site's public origin to the API service ALLOWED_ORIGINS.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Intentionally no startCommand — use Dockerfile ENTRYPOINT + CMD so volume
# chown + su-exec web run on every boot (required for banner uploads).
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
